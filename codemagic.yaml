workflows:
  ios-simulator-smoke:
    name: iOS Simulator Smoke
    max_build_duration: 60
    environment:
      groups:
        - CF_Access
      xcode: latest
      node: 20.11.0
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build and launch in iOS Simulator
        script: bash scripts/ios-simulator-smoke.sh

    artifacts:
      - build/simulator/*.png
      - build/simulator/*.log
      - build/simulator/*.txt

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic_ASC_API
    environment:
      groups:
        - CF_Access
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fiveohninelectric.field
      xcode: latest
      node: 20.11.0
    scripts: &ios_build_scripts
      - name: Install dependencies
        script: npm install

      - name: Verify Apple toolchain and release number
        script: |
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode / { split($2, v, "."); print v[1] }')"
          if [ -z "$XCODE_MAJOR" ] || [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "Xcode 26 or later is required for App Store Connect uploads."
            exit 1
          fi
          if [ "${CM_WORKFLOW_ID:-}" = "ios-testflight" ] && [ "${BUILD_NUMBER:-0}" -lt 42 ]; then
            echo "TestFlight build number must be at least 42."
            exit 1
          fi

      - name: Add iOS platform (first run only)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Generate iOS icons and splash from assets/
        script: |
          # @capacitor/assets reads assets/icon.png (1024x1024 RGB) and
          # assets/splash.png (2732x2732) and writes the full AppIcon.appiconset
          # + Splash.imageset into ios/App/App/Assets.xcassets/.
          # Without this step, `cap add ios` ships Capacitor's placeholder icons,
          # which Apple rejects under Guideline 2.3.8.
          npx @capacitor/assets generate --ios
          ls -la ios/App/App/Assets.xcassets/AppIcon.appiconset/ | head -20

      - name: Inject CF auth view controller
        script: |
          cat > ios/App/App/CFViewController.swift << 'SWIFT'
          import UIKit
          import Capacitor
          import WebKit

          class CFViewController: CAPBridgeViewController, WKNavigationDelegate {

            private let cfId  = "CF_ID_PLACEHOLDER"
            private let cfSec = "CF_SEC_PLACEHOLDER"

            override func viewDidLoad() {
              super.viewDidLoad()
              webView?.navigationDelegate = self
              webView?.allowsBackForwardNavigationGestures = false
              if #available(iOS 16.4, *) {
                webView?.isInspectable = true
              }
              let js = #"""
              (function(){
                const id='\#(self.cfId)',sec='\#(self.cfSec)',h='automation.509electric.com';

                // Resolve exactly as browser fetch does; never match host text in a path/query.
                function gatedURL(value){
                  if(typeof value!=='string'||!value||/[\u0000-\u0020\u007f\\]/.test(value)
                     ||/%(?![0-9a-f]{2})/i.test(value)) return null;
                  if(/^[a-z][a-z0-9+.-]*:/i.test(value)&&!/^https:\/\//i.test(value)) return null;
                  const authority=value.match(/^(?:[a-z][a-z0-9+.-]*:)?\/\/([^/?#]*)/i);
                  if(authority&&authority[1].includes('@')) return null;
                  try{
                    const url=new URL(value,document.baseURI);
                    return url.origin==='https://automation.509electric.com'&&!url.username&&!url.password?url:null;
                  }catch(_){ return null; }
                }

                const orig=window.fetch.bind(window);
                window.fetch=function(i,o){
                  const u=typeof i==='string'?i:(i instanceof URL?i.href:(i&&i.url)||'');
                  if(gatedURL(u)){
                    const headers=new Headers(o&&o.headers!==undefined?o.headers:(i&&i.headers));
                    headers.set('CF-Access-Client-Id',id);
                    headers.set('CF-Access-Client-Secret',sec);
                    const redirect=o&&o.redirect!==undefined?o.redirect:(i&&i.redirect);
                    // Fetch cannot inspect a redirect target before forwarding custom headers.
                    o={...o,headers:Object.fromEntries(headers),redirect:redirect==='manual'?'manual':'error'};
                  }
                  return orig(i,o);
                };

                const imgDesc=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,'src');
                Object.defineProperty(HTMLImageElement.prototype,'src',{
                  set:function(url){
                    const gated=gatedURL(url);
                    if(gated){
                      if(/[?&]_k=/.test(url)){ imgDesc.set.call(this,url); return; }
                      const el=this;
                      const full=gated.href;
                      const prevBlob=el._cfBlob;
                      window.fetch(full)
                        .then(r=>r.blob())
                        .then(b=>{
                          const newBlob=URL.createObjectURL(b);
                          imgDesc.set.call(el,newBlob);
                          el._cfBlob=newBlob;
                          const cleanup=()=>{
                            if(prevBlob&&prevBlob!==newBlob){
                              try{URL.revokeObjectURL(prevBlob);}catch(_){}
                            }
                          };
                          el.addEventListener('load',cleanup,{once:true});
                          el.addEventListener('error',cleanup,{once:true});
                        })
                        .catch(()=>{imgDesc.set.call(el,url);});
                    } else { imgDesc.set.call(this,url); }
                  },
                  get:function(){return imgDesc.get.call(this);}
                });

                const setAttrOrig=Element.prototype.setAttribute;
                Element.prototype.setAttribute=function(name,value){
                  if(this instanceof HTMLImageElement&&name&&name.toLowerCase()==='src'&&value){
                    this.src=value;
                    return;
                  }
                  return setAttrOrig.apply(this,arguments);
                };
              })();
              """#
              let s=WKUserScript(source:js,injectionTime:.atDocumentStart,forMainFrameOnly:false)
              webView?.configuration.userContentController.addUserScript(s)
            }

            private func isGatedOrigin(_ url:URL)->Bool {
              guard let parts=URLComponents(url:url,resolvingAgainstBaseURL:false) else { return false }
              return parts.scheme?.lowercased()=="https"
                && parts.host?.lowercased()=="automation.509electric.com"
                && parts.user==nil && parts.password==nil
                && (parts.port==nil || parts.port==443)
            }

            func webView(_ webView:WKWebView,decidePolicyFor action:WKNavigationAction,
                         decisionHandler:@escaping(WKNavigationActionPolicy)->Void){
              if action.navigationType == .backForward { decisionHandler(.allow); return }
              guard let url=action.request.url,
                    isGatedOrigin(url),
                    action.request.value(forHTTPHeaderField:"CF-Access-Client-Id")==nil
              else { decisionHandler(.allow); return }
              decisionHandler(.cancel)
              var r=action.request
              r.setValue(cfId,forHTTPHeaderField:"CF-Access-Client-Id")
              r.setValue(cfSec,forHTTPHeaderField:"CF-Access-Client-Secret")
              webView.load(r)
            }
          }
          SWIFT

          # Substitute real credentials
          sed -i '' "s|CF_ID_PLACEHOLDER|$CF_CLIENT_ID|g" ios/App/App/CFViewController.swift
          sed -i '' "s|CF_SEC_PLACEHOLDER|$CF_CLIENT_SECRET|g" ios/App/App/CFViewController.swift

          # Point storyboard to our subclass
          find ios/App -name "*.storyboard" | xargs grep -l "CAPBridgeViewController" || echo "WARNING: CAPBridgeViewController not found in any storyboard"
          find ios/App -name "*.storyboard" | xargs sed -i '' \
            -e 's/customClass="CAPBridgeViewController"/customClass="CFViewController"/g' \
            -e 's/customClass="CFViewController" customModule="Capacitor"/customClass="CFViewController" customModule="App"/g'
          echo "Storyboard patch applied"
          grep -r "CFViewController" ios/App --include="*.storyboard" || echo "WARNING: CFViewController not in storyboard after patch"

          # Add file to Xcode project
          gem install xcodeproj --no-document 2>/dev/null
          ruby - << 'RUBY'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = proj.targets.first
          grp = proj.main_group.find_subpath('App', true)
          ref = grp.new_file('CFViewController.swift')
          target.add_file_references([ref])
          proj.save
          RUBY

      - name: Set build number, compliance, and permissions
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Take job site photos'" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Take job site photos'" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Choose photos from your library'" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Choose photos from your library'" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Save photos to your library'" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'Save photos to your library'" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Record video with audio'" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'Record video with audio'" ios/App/App/Info.plist

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
        beta_groups:
          # Internal group: needs no beta review, so it works today.
          # The external group "Testers" is blocked by
          # BETA_CONTRACT_MISSING (Apple support case 20000138361635);
          # add it back once Apple restores the beta contract.
          - 509 Electric

  ios-adhoc:
    # Builds an Ad Hoc IPA signed for devices registered in the Apple Developer
    # Portal — installs via MDM (Mosyle) without App Store / TestFlight / ABM.
    # Reuses the ios-testflight build scripts via YAML anchor; the only
    # differences are the distribution_type and the absence of a publishing
    # block (we just want the IPA as a downloadable artifact).
    #
    # Prereq: each target iPad's UDID must be registered in
    # developer.apple.com > Devices BEFORE running this. Codemagic's
    # `xcode-project use-profiles` auto-generates an ad-hoc profile that
    # includes whichever devices are registered at build time.
    name: iOS Ad Hoc
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic_ASC_API
    environment:
      groups:
        - CF_Access
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.fiveohninelectric.field
      xcode: latest
      node: 20.11.0
    scripts: *ios_build_scripts

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # No publishing block — Codemagic surfaces the IPA as a downloadable
    # artifact in the build page. Download it and upload to Mosyle > Apps.

  field-app-android:
    # Android port of ios-testflight. `android/` is gitignored (same convention as
    # `ios/`), so the whole native project — including the Cloudflare Access bridge
    # — is regenerated from scratch on every build. See MainActivity.java /
    # CFAccessWebViewClient.java / CFAccessJsShim.java below for why this needs a
    # real native WebViewClient and not just WebView.loadUrl(url, extraHeaders):
    # that API only covers the very first page load, and Android's
    # shouldInterceptRequest exposes GET headers but never a POST/PUT/DELETE body,
    # so the bridge is split GET-vs-body-bearing between native code and a
    # document-start JS shim (mirrors CFViewController.swift's WKUserScript).
    name: 509 Electric Field App Android
    max_build_duration: 60
    environment:
      groups:
        - CF_Access
      android_signing:
        - field_upload_keystore
      java: 17
      node: 20.11.0
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Verify Android release configuration
        script: npm test

      - name: Add Android platform (first run only)
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate Android icons and splash from assets/
        script: |
          # Mirrors "Generate iOS icons and splash from assets/": @capacitor/assets
          # reads assets/icon.png + assets/splash.png and writes the mipmap/drawable
          # resources into android/app/src/main/res/. Without this, `cap add android`
          # ships Capacitor's placeholder launcher icon.
          npx @capacitor/assets generate --android
          ls -la android/app/src/main/res/mipmap-xxxhdpi/ 2>/dev/null || true

      - name: Patch AndroidManifest.xml (camera/mic permissions + intent queries)
        script: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            perl -0pi -e 's{(\s*<uses-permission android:name="android.permission.INTERNET" />)}{\n\n    <!-- Camera/mic capture via <input capture> in the web app (job site photos\n         and video), handled by Capacitor'"'"'s default BridgeWebChromeClient.\n         Mirrors iOS'"'"'s NSCameraUsageDescription / NSMicrophoneUsageDescription.\n         The queries block is required for resolveActivity() to find a camera\n         app at targetSdk 30+ package-visibility rules. -->\n    <queries>\n        <intent><action android:name="android.media.action.IMAGE_CAPTURE" /></intent>\n        <intent><action android:name="android.media.action.VIDEO_CAPTURE" /></intent>\n    </queries>\n$1\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />}' "$MANIFEST"
          fi
          grep -q "android.permission.CAMERA" "$MANIFEST" || { echo "ERROR: AndroidManifest.xml patch failed"; exit 1; }
          cat "$MANIFEST"

      - name: Set compile/target SDK to 36 and wire release signing
        script: |
          set -euo pipefail
          # Google Play requires new apps and updates to target API 36 (Android 16)
          # beginning Aug 31 2026.
          cat > android/variables.gradle << 'GRADLE'
          ext {
              minSdkVersion = 22
              compileSdkVersion = 36
              targetSdkVersion = 36
              androidxActivityVersion = '1.8.0'
              androidxAppCompatVersion = '1.6.1'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.12.0'
              androidxFragmentVersion = '1.6.2'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.9.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              cordovaAndroidVersion = '10.1.1'
          }
          GRADLE

          cat > android/app/build.gradle << 'GRADLE'
          apply plugin: 'com.android.application'

          android {
              namespace "com.fiveohninelectric.field"
              compileSdk rootProject.ext.compileSdkVersion
              defaultConfig {
                  applicationId "com.fiveohninelectric.field"
                  minSdkVersion rootProject.ext.minSdkVersion
                  targetSdkVersion rootProject.ext.targetSdkVersion
                  // -PversionCode=$BUILD_NUMBER is passed on the gradlew invocation below
                  // (Play Console requires a strictly increasing versionCode per upload).
                  versionCode project.hasProperty('versionCode') ? (project.versionCode as Integer) : 1
                  versionName project.hasProperty('versionName') ? project.versionName : "1.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
                  aaptOptions {
                      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
                  }
              }
              signingConfigs {
                  release {
                      // Populated by the android_signing: field_upload_keystore
                      // integration above, which decodes the uploaded keystore and
                      // exports these env vars. Guarded so a plain local ./gradlew
                      // build without them still succeeds unsigned.
                      if (System.getenv()["CM_KEYSTORE_PATH"]) {
                          storeFile file(System.getenv()["CM_KEYSTORE_PATH"])
                          storePassword System.getenv()["CM_KEYSTORE_PASSWORD"]
                          keyAlias System.getenv()["CM_KEY_ALIAS"]
                          keyPassword System.getenv()["CM_KEY_PASSWORD"]
                      }
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                  }
              }
          }

          repositories {
              flatDir{
                  dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
              }
          }

          dependencies {
              implementation fileTree(include: ['*.jar'], dir: 'libs')
              implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
              implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
              implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
              // capacitor-android depends on this as `implementation`, not `api`, so
              // it isn't on our compile classpath transitively — needed directly for
              // WebViewCompat/WebViewFeature in the CF Access bridge below.
              implementation "androidx.webkit:webkit:$androidxWebkitVersion"
              implementation project(':capacitor-android')
              testImplementation "junit:junit:$junitVersion"
              androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
              androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
              implementation project(':capacitor-cordova-android-plugins')
          }

          apply from: 'capacitor.build.gradle'

          try {
              def servicesJSON = file('google-services.json')
              if (servicesJSON.text) {
                  apply plugin: 'com.google.gms.google-services'
              }
          } catch(Exception e) {
              logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
          }
          GRADLE

      - name: Inject CF Access bridge (native WebViewClient + JS shim)
        script: |
          set -euo pipefail
          PKG_DIR="android/app/src/main/java/com/fiveohninelectric/field"
          mkdir -p "$PKG_DIR"

          cat > "$PKG_DIR/CFAccessJsShim.java" << 'JAVA'
          package com.fiveohninelectric.field;

          /**
           * JS source for the document-start script that patches window.fetch and
           * HTMLImageElement.prototype.src to carry CF-Access-Client-Id /
           * CF-Access-Client-Secret headers. Ports the WKUserScript body injected by
           * ios/App/App/CFViewController.swift. Exists specifically to cover requests
           * whose bodies CFAccessWebViewClient.shouldInterceptRequest cannot see or
           * replay (POST/PUT/DELETE fetch calls) — everything else (main-frame page
           * load, every GET sub-resource) is handled natively there instead.
           */
          final class CFAccessJsShim {

              private CFAccessJsShim() {}

              static String build(String clientId, String clientSecret, String gatedHost) {
                  return "(function(){\n"
                      + "  const id='" + escape(clientId) + "',sec='" + escape(clientSecret) + "',h='" + escape(gatedHost) + "';\n"
                      + "\n"
                      + "  // Resolve exactly as browser fetch does; never match host text in a path/query.\n"
                      + "  function gatedURL(value){\n"
                      + "    if(typeof value!=='string'||!value||/[\\u0000-\\u0020\\u007f\\\\]/.test(value)\n"
                      + "       ||/%(?![0-9a-f]{2})/i.test(value)) return null;\n"
                      + "    if(/^[a-z][a-z0-9+.-]*:/i.test(value)&&!/^https:\\/\\//i.test(value)) return null;\n"
                      + "    const authority=value.match(/^(?:[a-z][a-z0-9+.-]*:)?\\/\\/([^/?#]*)/i);\n"
                      + "    if(authority&&authority[1].includes('@')) return null;\n"
                      + "    try{\n"
                      + "      const url=new URL(value,document.baseURI);\n"
                      + "      return url.origin==='https://automation.509electric.com'&&!url.username&&!url.password?url:null;\n"
                      + "    }catch(_){ return null; }\n"
                      + "  }\n"
                      + "\n"
                      + "  const orig=window.fetch.bind(window);\n"
                      + "  window.fetch=function(i,o){\n"
                      + "    const u=typeof i==='string'?i:(i instanceof URL?i.href:(i&&i.url)||'');\n"
                      + "    if(gatedURL(u)){\n"
                      + "      const headers=new Headers(o&&o.headers!==undefined?o.headers:(i&&i.headers));\n"
                      + "      headers.set('CF-Access-Client-Id',id);\n"
                      + "      headers.set('CF-Access-Client-Secret',sec);\n"
                      + "      const redirect=o&&o.redirect!==undefined?o.redirect:(i&&i.redirect);\n"
                      + "      // Fetch cannot inspect a redirect target before forwarding custom headers.\n"
                      + "      o={...o,headers:Object.fromEntries(headers),redirect:redirect==='manual'?'manual':'error'};\n"
                      + "    }\n"
                      + "    return orig(i,o);\n"
                      + "  };\n"
                      + "\n"
                      + "  const imgDesc=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,'src');\n"
                      + "  Object.defineProperty(HTMLImageElement.prototype,'src',{\n"
                      + "    set:function(url){\n"
                      + "      const gated=gatedURL(url);\n"
                      + "      if(gated){\n"
                      + "        if(/[?&]_k=/.test(url)){ imgDesc.set.call(this,url); return; }\n"
                      + "        const el=this;\n"
                      + "        const full=gated.href;\n"
                      + "        const prevBlob=el._cfBlob;\n"
                      + "        window.fetch(full)\n"
                      + "          .then(r=>r.blob())\n"
                      + "          .then(b=>{\n"
                      + "            const newBlob=URL.createObjectURL(b);\n"
                      + "            imgDesc.set.call(el,newBlob);\n"
                      + "            el._cfBlob=newBlob;\n"
                      + "            const cleanup=()=>{\n"
                      + "              if(prevBlob&&prevBlob!==newBlob){\n"
                      + "                try{URL.revokeObjectURL(prevBlob);}catch(_){}\n"
                      + "              }\n"
                      + "            };\n"
                      + "            el.addEventListener('load',cleanup,{once:true});\n"
                      + "            el.addEventListener('error',cleanup,{once:true});\n"
                      + "          })\n"
                      + "          .catch(()=>{imgDesc.set.call(el,url);});\n"
                      + "      } else { imgDesc.set.call(this,url); }\n"
                      + "    },\n"
                      + "    get:function(){return imgDesc.get.call(this);}\n"
                      + "  });\n"
                      + "\n"
                      + "  const setAttrOrig=Element.prototype.setAttribute;\n"
                      + "  Element.prototype.setAttribute=function(name,value){\n"
                      + "    if(this instanceof HTMLImageElement&&name&&name.toLowerCase()==='src'&&value){\n"
                      + "      this.src=value;\n"
                      + "      return;\n"
                      + "    }\n"
                      + "    return setAttrOrig.apply(this,arguments);\n"
                      + "  };\n"
                      + "})();";
              }

              private static String escape(String s) {
                  if (s == null) return "";
                  return s.replace("\\", "\\\\").replace("'", "\\'");
              }
          }
          JAVA

          cat > "$PKG_DIR/CFAccessWebViewClient.java" << 'JAVA'
          package com.fiveohninelectric.field;

          import android.net.Uri;
          import android.webkit.CookieManager;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebView;
          import com.getcapacitor.Bridge;
          import com.getcapacitor.BridgeWebViewClient;
          import com.getcapacitor.Logger;
          import java.io.ByteArrayInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URI;
          import java.net.URISyntaxException;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;

          /**
           * Native Android equivalent of ios/App/App/CFViewController.swift: attaches
           * the Cloudflare Access service-token headers to every GET request this
           * WebView makes to automation.509electric.com, so the app never shows
           * Cloudflare's login wall. Only GET is intercepted here — Android gives
           * shouldInterceptRequest no access to a POST/PUT/DELETE body, so those are
           * instead covered by CFAccessJsShim, added directly inside window.fetch
           * before the request leaves JS (see MainActivity). shouldInterceptRequest
           * runs off the UI thread for every resource, so the synchronous
           * HttpURLConnection call below is safe.
           */
          public class CFAccessWebViewClient extends BridgeWebViewClient {

              private static final String TAG = "CFAccessBridge";
              private static final String CF_ID_HEADER = "CF-Access-Client-Id";
              private static final String CF_SECRET_HEADER = "CF-Access-Client-Secret";

              private final String cfClientId;
              private final String cfClientSecret;
              private final String gatedHost;
              private final String reloadUrl;
              private volatile boolean mainFrameRetried = false;

              public CFAccessWebViewClient(Bridge bridge, String cfClientId, String cfClientSecret, String gatedHost, String reloadUrl) {
                  super(bridge);
                  this.cfClientId = cfClientId;
                  this.cfClientSecret = cfClientSecret;
                  this.gatedHost = gatedHost;
                  this.reloadUrl = reloadUrl;
              }

              private boolean haveCredentials() {
                  return cfClientId != null && !cfClientId.isEmpty() && !cfClientId.startsWith("CF_ID_PLACEHOLDER");
              }

              private boolean isGatedOrigin(Uri uri) {
                  if (uri == null) return false;
                  try {
                      URI parsed = new URI(uri.toString());
                      return "https".equalsIgnoreCase(parsed.getScheme())
                          && "automation.509electric.com".equalsIgnoreCase(parsed.getHost())
                          && parsed.getRawUserInfo() == null
                          && (parsed.getPort() == -1 || parsed.getPort() == 443);
                  } catch (URISyntaxException e) { return false; }
              }

              private boolean isAccessLogin(Uri uri) {
                  if (uri == null) return false;
                  try {
                      URI parsed = new URI(uri.toString());
                      String host = parsed.getHost();
                      return "https".equalsIgnoreCase(parsed.getScheme()) && host != null
                          && ("cloudflareaccess.com".equalsIgnoreCase(host)
                              || host.toLowerCase(java.util.Locale.ROOT).endsWith(".cloudflareaccess.com"))
                          && parsed.getRawUserInfo() == null
                          && (parsed.getPort() == -1 || parsed.getPort() == 443);
                  } catch (URISyntaxException e) { return false; }
              }

              @Override
              public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                  Uri uri = request.getUrl();
                  String host = uri.getHost();
                  String method = request.getMethod() == null ? "GET" : request.getMethod().toUpperCase();

                  boolean isGatedHost = haveCredentials() && isGatedOrigin(uri);
                  boolean isGet = "GET".equals(method);
                  boolean alreadyHasCfHeaders = request.getRequestHeaders() != null && hasHeaderIgnoreCase(request.getRequestHeaders(), CF_ID_HEADER);

                  if (!isGatedHost || !isGet || alreadyHasCfHeaders) {
                      return super.shouldInterceptRequest(view, request);
                  }

                  try {
                      return fetchWithCfHeaders(uri, request);
                  } catch (Exception e) {
                      Logger.error(TAG, "Protected request failed; no credentialed redirect fallback", null);
                      return new WebResourceResponse("text/plain", "UTF-8", 502, "Bad Gateway", new HashMap<>(),
                          new ByteArrayInputStream("Protected request unavailable".getBytes(java.nio.charset.StandardCharsets.UTF_8)));
                  }
              }

              /**
               * Belt-and-suspenders fallback: if the very first main-frame load raced
               * Capacitor's own default WebViewClient (that call happens inside
               * super.onCreate(), before MainActivity swaps in this client) and lost,
               * Cloudflare Access responds with a 302 to a *.cloudflareaccess.com login
               * page. WebView follows that redirect as a normal navigation, which DOES
               * flow through shouldOverrideUrlLoading (unlike the app's own initial
               * loadUrl call) — catch it here and force one clean reload with headers
               * attached via the native loadUrl(url, extraHeaders) path.
               */
              @Override
              public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                  Uri uri = request.getUrl();
                  String host = uri.getHost();
                  if (haveCredentials() && !mainFrameRetried && request.isForMainFrame()
                      && isAccessLogin(uri) && isGatedOrigin(Uri.parse(reloadUrl))) {
                      mainFrameRetried = true;
                      Logger.warn(TAG, "Redirected to Cloudflare Access login wall for " + gatedHost + " — reloading with CF headers attached natively.");
                      Map<String, String> headers = new HashMap<>();
                      headers.put(CF_ID_HEADER, cfClientId);
                      headers.put(CF_SECRET_HEADER, cfClientSecret);
                      view.post(() -> view.loadUrl(reloadUrl, headers));
                      return true;
                  }
                  return super.shouldOverrideUrlLoading(view, request);
              }

              private WebResourceResponse fetchWithCfHeaders(Uri uri, WebResourceRequest request) throws IOException {
                  HttpURLConnection conn;
                  int status;
                  int redirects = 0;
                  while (true) {
                      if (!isGatedOrigin(uri)) throw new IOException("Protected origin rejected");
                      conn = (HttpURLConnection) new URL(uri.toString()).openConnection();
                      conn.setConnectTimeout(15000);
                      conn.setReadTimeout(20000);
                      conn.setInstanceFollowRedirects(false);
                      conn.setRequestMethod("GET");
                      Map<String, String> originalHeaders = request.getRequestHeaders();
                      if (originalHeaders != null) {
                          for (Map.Entry<String, String> h : originalHeaders.entrySet()) {
                              if (!h.getKey().equalsIgnoreCase("Host")
                                  && !h.getKey().equalsIgnoreCase(CF_ID_HEADER)
                                  && !h.getKey().equalsIgnoreCase(CF_SECRET_HEADER)) {
                                  conn.setRequestProperty(h.getKey(), h.getValue());
                              }
                          }
                      }
                      // Set the native pair after ordinary caller headers, case-insensitively.
                      conn.setRequestProperty(CF_ID_HEADER, cfClientId);
                      conn.setRequestProperty(CF_SECRET_HEADER, cfClientSecret);
                      String cookie = CookieManager.getInstance().getCookie(uri.toString());
                      if (cookie != null && !cookie.isEmpty()) {
                          conn.setRequestProperty("Cookie", cookie);
                      }

                      status = conn.getResponseCode();
                      if (status >= 300 && status < 400) {
                          String location = conn.getHeaderField("Location");
                          conn.disconnect();
                          if (location == null || ++redirects > 5) throw new IOException("Protected redirect unavailable");
                          try {
                              URI next = new URI(uri.toString()).resolve(new URI(location));
                              uri = Uri.parse(next.toString());
                          } catch (URISyntaxException e) { throw new IOException("Malformed protected redirect"); }
                          if (!isGatedOrigin(uri)) throw new IOException("Cross-origin protected redirect rejected");
                          continue;
                      }
                      break;
                  }
                  String reason = conn.getResponseMessage();
                  InputStream body = (status >= 400) ? conn.getErrorStream() : conn.getInputStream();
                  if (body == null) {
                      body = new ByteArrayInputStream(new byte[0]);
                  }

                  Map<String, String> responseHeaders = new HashMap<>();
                  for (Map.Entry<String, List<String>> h : conn.getHeaderFields().entrySet()) {
                      if (h.getKey() == null || h.getValue() == null || h.getValue().isEmpty()) continue;
                      responseHeaders.put(h.getKey(), h.getValue().get(0));
                  }

                  String contentType = conn.getContentType();
                  String mimeType = "application/octet-stream";
                  String encoding = null;
                  if (contentType != null) {
                      String[] parts = contentType.split(";");
                      mimeType = parts[0].trim();
                      for (String p : parts) {
                          String trimmed = p.trim();
                          if (trimmed.toLowerCase().startsWith("charset=")) {
                              encoding = trimmed.substring(8).trim();
                          }
                      }
                  }

                  return new WebResourceResponse(mimeType, encoding, status, (reason == null || reason.isEmpty()) ? "OK" : reason, responseHeaders, body);
              }

              private boolean hasHeaderIgnoreCase(Map<String, String> headers, String name) {
                  for (String k : headers.keySet()) {
                      if (k.equalsIgnoreCase(name)) return true;
                  }
                  return false;
              }
          }
          JAVA

          cat > "$PKG_DIR/MainActivity.java" << 'JAVA'
          package com.fiveohninelectric.field;

          import android.os.Bundle;
          import androidx.webkit.WebViewCompat;
          import androidx.webkit.WebViewFeature;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.Logger;
          import java.util.Collections;

          public class MainActivity extends BridgeActivity {

              // NOTE: the marker constant below is deliberately built via string
              // concatenation rather than written as one unbroken literal, and this
              // comment deliberately avoids spelling that literal out too. The
              // perl substitution step further down does an exact-text find/replace
              // of that literal across this whole file — if this marker (or this
              // comment) contained it unbroken, the substitution would rewrite it
              // right along with the real constant below, permanently breaking the
              // "did substitution actually happen" check (and, for the comment,
              // leaking the real secret into a source comment for no reason).
              private static final String CF_ID_UNSET_MARKER = "CF_ID" + "_PLACEHOLDER";
              private static final String CF_CLIENT_ID = "CF_ID_PLACEHOLDER";
              private static final String CF_CLIENT_SECRET = "CF_SEC_PLACEHOLDER";
              private static final String CF_GATED_HOST = "automation.509electric.com";
              private static final String CF_GATED_ORIGIN = "https://" + CF_GATED_HOST;
              private static final String CF_APP_URL = CF_GATED_ORIGIN + "/app";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (!haveCfCredentials()) {
                      Logger.warn(
                          "CFAccessBridge",
                          "No Cloudflare Access credentials baked in — requests to " +
                          CF_GATED_HOST +
                          " will hit the CF login wall. Expected for a local `npx cap run android` build; " +
                          "Codemagic injects real CF_CLIENT_ID/CF_CLIENT_SECRET values at build time."
                      );
                  }

                  CFAccessWebViewClient cfClient = new CFAccessWebViewClient(bridge, CF_CLIENT_ID, CF_CLIENT_SECRET, CF_GATED_HOST, CF_APP_URL);
                  bridge.setWebViewClient(cfClient);

                  if (haveCfCredentials() && WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                      String script = CFAccessJsShim.build(CF_CLIENT_ID, CF_CLIENT_SECRET, CF_GATED_HOST);
                      WebViewCompat.addDocumentStartJavaScript(bridge.getWebView(), script, Collections.singleton(CF_GATED_ORIGIN));
                  }
              }

              private boolean haveCfCredentials() {
                  return CF_CLIENT_ID != null && !CF_CLIENT_ID.isEmpty() && !CF_CLIENT_ID.equals(CF_ID_UNSET_MARKER);
              }
          }
          JAVA

          # Substitute real credentials (same placeholder names/pattern as iOS).
          # $ENV{...} is referenced (not string-interpolated) so this is safe
          # regardless of what characters CF_CLIENT_ID/CF_CLIENT_SECRET contain —
          # do NOT switch this to \Q...\E in the replacement side, that quotemeta's
          # the literal value into the output instead of protecting the pattern.
          perl -pi -e 's/CF_ID_PLACEHOLDER/$ENV{CF_CLIENT_ID}/g' "$PKG_DIR/MainActivity.java"
          perl -pi -e 's/CF_SEC_PLACEHOLDER/$ENV{CF_CLIENT_SECRET}/g' "$PKG_DIR/MainActivity.java"
          grep -q "CF_ID_PLACEHOLDER" "$PKG_DIR/MainActivity.java" && { echo "ERROR: CF credential substitution failed"; exit 1; }
          echo "CF Access bridge injected."

      - name: Verify CF Access credentials are live (same headers the app injects)
        script: |
          set -euo pipefail
          # This doesn't exercise the native Android WebViewClient/JS shim itself —
          # that needs an on-device or emulator run (see IOS_SIMULATOR.md-equivalent
          # follow-up for Android). What it DOES prove: the exact CF-Access-Client-Id
          # / CF-Access-Client-Secret values this build just baked into
          # MainActivity.java are current and Cloudflare Access accepts them —
          # i.e. if the native bridge is attaching these headers correctly, there is
          # nothing else standing between the app and a real login. Catches the
          # "credentials rotated/expired" failure mode independently of any Android
          # runtime bug.
          STATUS=$(curl -s -D /tmp/cf_check_headers.txt -o /tmp/cf_check_body.html -w '%{http_code}' \
            -H "CF-Access-Client-Id: $CF_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_CLIENT_SECRET" \
            https://automation.509electric.com/api/health)
          echo "HTTP status from automation.509electric.com: $STATUS"
          if grep -qi "cloudflareaccess.com" /tmp/cf_check_headers.txt /tmp/cf_check_body.html 2>/dev/null; then
            echo "ERROR: response references cloudflareaccess.com — Cloudflare Access rejected"
            echo "these headers and served its login wall instead of reaching the origin."
            echo "--- response headers ---"
            cat /tmp/cf_check_headers.txt
            echo "--- response body (first 2KB) ---"
            head -c 2000 /tmp/cf_check_body.html
            exit 1
          fi
          echo "No Cloudflare Access login-wall markers in the response — these credentials reach the origin."

      - name: Sync Capacitor
        script: npx cap sync android

      - name: Build Android bundle (release AAB) + debug APK
        script: |
          set -euo pipefail
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleDebug -PversionCode="${BUILD_NUMBER:-1}" -PversionName="1.0" --stacktrace

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
